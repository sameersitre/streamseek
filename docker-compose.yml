services:
  # ─── Nginx (Reverse Proxy + HTTPS) ─────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ─── Certbot (SSL Certificate Renewal) ─────────────
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

  # ─── Frontend (Next.js 16) ─────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://streamseek.sameersitre.dev/api/v2}
    expose:
      - "3000"
    environment:
      - HOSTNAME=0.0.0.0
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

  # ─── Backend (Express API) ─────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/bingefeast
      - TMDB_URL=${TMDB_URL}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - WATCHMODE_API_URL=${WATCHMODE_API_URL}
      - WATCHMODE_API_KEY=${WATCHMODE_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - CLIENT_URL=http://frontend:3000
      - GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}
      - GOOGLE_CLIENT_ID_IOS=${GOOGLE_CLIENT_ID_IOS}
      - GOOGLE_CLIENT_ID_ANDROID=${GOOGLE_CLIENT_ID_ANDROID}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  # ─── MongoDB ───────────────────────────────────────
  mongodb:
    image: mongo:7
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "27017:27017"

volumes:
  mongodb_data:
    driver: local

networks:
  app-network:
    driver: bridge
