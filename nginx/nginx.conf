events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS resolver.
    # Using 'set $upstream_X hostname' variables forces nginx to resolve service names
    # at request time rather than at startup — prevents crash-loops when nginx starts
    # before dependent containers join the Docker network.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─── Redirect HTTP → HTTPS (both domains) ────────
    server {
        listen 80;
        server_name sameersitre.dev www.sameersitre.dev streamseek.sameersitre.dev;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── Portfolio (sameersitre.dev) ──────────────────
    server {
        listen 443 ssl;
        server_name sameersitre.dev www.sameersitre.dev;

        ssl_certificate     /etc/letsencrypt/live/sameersitre.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sameersitre.dev/privkey.pem;

        location / {
            set $upstream_portfolio portfolio;
            proxy_pass http://$upstream_portfolio:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── StreamSeek (streamseek.sameersitre.dev) ──────
    server {
        listen 443 ssl;
        server_name streamseek.sameersitre.dev;

        ssl_certificate     /etc/letsencrypt/live/streamseek.sameersitre.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/streamseek.sameersitre.dev/privkey.pem;

        # ── Backend API requests → backend (:8000) ────
        # Only /api/v2/ goes to backend; /api/auth/ stays on frontend (Auth.js)
        location /api/v2/ {
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Everything else → frontend (:3000) ────────
        location / {
            set $upstream_frontend frontend;
            proxy_pass http://$upstream_frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
