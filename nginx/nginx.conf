events {
    worker_connections 1024;
}

http {
    # ─── Redirect HTTP → HTTPS ────────────────────────
    server {
        listen 80;
        server_name streamseek.sameersitre.dev;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS Server ─────────────────────────────────
    server {
        listen 443 ssl;
        server_name streamseek.sameersitre.dev;

        ssl_certificate     /etc/letsencrypt/live/streamseek.sameersitre.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/streamseek.sameersitre.dev/privkey.pem;

        # ── Backend API requests → backend (:8000) ────
        # Only /api/v2/ goes to backend; /api/auth/ stays on frontend (Auth.js)
        location /api/v2/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Everything else → frontend (:3000) ────────
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
